[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specify"
version = "0.1.0"
description = "A contract-based specification lifecycle CLI"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "markdown-it-py>=3.0",
  "ruamel.yaml>=0.18",
  "rich>=14.0",
]

[project.scripts]
specify = "specify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specify = ["assets/*.yaml", "assets/templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
